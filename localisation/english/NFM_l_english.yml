 NFM_start_title:1 "National Focus Manager"
 NFM_start_text:1 "Thank you for downloading this MOD. This is a usage guide. \nDue to the poor English skills of the creator of this mod, parts of the English version were created using Google Translate. X("
 NFM_start_text_error:1 "Thank you for downloading this MOD.\n§RCurrently, this mod does not work in this country.§!"
 NFM_start_title_1:1 "To reserve focuses"
 NFM_start_desc_1:1 "To reserve an focus, click the plus sign button to the right of each focus icon.\nOnce an focus is reserved, the plus sign will change to display the reservation order.\nClick the button again to cancel the reservation.\nAs the game progresses, focus will automatically begin to progress.\n\nKnown Issues\nWhen you complete an mutually exclusive focus, reservations for routes you did not select may remain in the queue. Please cancel reservations manually if necessary."
 NFM_start_title_2:1 "To check the reservation queue"
 NFM_start_desc_2:1 "To check the reservation queue, click the button in the upper left of the tree. \nIn the queue, you can check the list of reserved focuses, change the reservation order, and cancel them all at once."
 NFM_start_close:1 "Close"
