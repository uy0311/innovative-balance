l_japanese:
# GPT-5.6 Terraで作成
 NFM:1 "NFM"
 Error:1 "エラー"
 NFM_queue_title:1 "NFキュー"
 NFM_queue_text_inst:1 "このキュー内のNFを上から順に取得する。"
 NFM_queue_state_active:1 "国家方針「§Y[NFM_focustitle]§!」を取得中。"
 NFM_queue_state_error:1 "何らかの§R問題が発生§!したため自動取得が§R一時停止§!しています。\nキューを確認してください。"
 NFM_queue_clear_button:1 "全削除"
 NFM_queue_clear_button_tt:1 "NFキューからすべての国家方針を削除する。"
 NFM_queue_template_button:1 "テンプレート"
 NFM_queue_template_button_tt:1 "NF取得順のテンプレートを選択する。"
 NFM_template_title:1 "テンプレートの一覧"
 NFM_template_text_inst:1 "使いたいテンプレートをクリックすると、予約キューにNFが追加されます。"
 NFM_template_tt_loc:1 "[NFM_template_tt]"
 NFM_arrow_up:1 "クリックで優先順位を§Y上昇§!させる。\nShift+クリックで取得の優先順位を§Y最大§!にする。"
 NFM_arrow_down:1 "クリックで優先順位を§Y低下§!させる。\nShift+クリックで取得の優先順位を§Y最低§!にする。"
 NFM_start_title:1 "National Focus 予約機能"
 NFM_start_text:1 "MOD National Focus Manager より NF予約機能を使用させていただいています。\n以下は使い方ガイドになります。"
 NFM_start_text_error:1 "当MODをダウンロードいただきありがとうございます。\n§R現在この国家には対応していません。§!"
 NFM_start_title_1:1 "NFを予約するには"
 NFM_start_desc_1:1 "NFを予約するには、各NFのアイコン右横にあるプラスマークのボタンをクリックしてください。\nNFが予約されると、プラスマークが予約順の表示に切り替わります。\nもう一度ボタンをクリックすると予約が解除されます。\n時間を進めると、自動で取得が開始されます。\n\n既知の問題\n択一NFを取得した際、選択しなかったルートの予約が残る場合があります。お手数ですが、必要に応じて手動で予約を解除してください。"
 NFM_start_title_2:1 "予約キューを確認するには"
 NFM_start_desc_2:1 "予約キューを確認するには、ツリー左上のボタンをクリックしてください。\n予約キューでは、予約したNFを一覧で確認できるほか、予約順序の変更や一括削除が可能です。"
 NFM_start_close:1 "閉じる"
